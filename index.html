<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan City Tour - BBGTK DIY</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Blockly Library -->
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', cursive;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10b981;
        }
        .blocklySvg {
            background-color: #1e293b !important;
            border-radius: 0.75rem;
        }
        .blocklyToolboxDiv {
            background-color: #0f172a !important;
            border-right: 1px solid #334155;
            padding: 4px;
        }
        .blocklyTreeLabel {
            color: #f8fafc !important;
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 text-white shadow-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap justify-between items-center gap-3">
            
            <!-- Left Side: BBGTK DIY Logo & Title -->
            <div class="flex items-center gap-3">
                <img src="bbgtk diy logo.png" alt="BBGTK DIY Logo" class="h-10 md:h-12 w-auto object-contain bg-white/10 p-1 rounded-lg border border-slate-700" onerror="this.onerror=null; this.src='https://placehold.co/120x50/1e293b/10b981?text=BBGTK+DIY';">
                <div>
                    <h1 class="text-lg md:text-xl font-bold text-emerald-400 tracking-wide flex items-center gap-2">
                        Petualangan City Tour
                    </h1>
                    <p class="text-[11px] text-slate-400 hidden sm:block">Numerasi, Logika & Pemahaman Spasial Kota Si Yo</p>
                </div>
            </div>

            <!-- Right Side: Si Yo Mascot & Mission Selector -->
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-slate-800/90 p-1.5 pl-2.5 rounded-xl border border-slate-700">
                    <img src="maskot-siyo.png" alt="Maskot Si Yo" class="h-9 md:h-11 w-auto object-contain drop-shadow" onerror="this.onerror=null; this.src='https://placehold.co/80x80/10b981/ffffff?text=Si+Yo';">
                    <div class="flex items-center gap-1.5">
                        <label for="levelSelect" class="text-xs font-semibold text-slate-300 flex items-center gap-1">
                            <i class="fa-solid fa-map-pin text-amber-400"></i> Misi:
                        </label>
                        <select id="levelSelect" class="bg-slate-900 text-emerald-300 text-xs md:text-sm font-semibold py-1 px-2.5 rounded-lg border border-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none cursor-pointer">
                        </select>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-3 md:p-4 flex flex-col lg:flex-row gap-4">

        <!-- LEFT PANEL: Blockly Workspace & Controls -->
        <section class="lg:w-1/2 flex flex-col gap-3 order-2 lg:order-1 min-h-[550px]">
            
            <!-- Controls Bar -->
            <div class="bg-slate-900 p-2.5 rounded-2xl border border-slate-800 flex flex-wrap items-center justify-between gap-2 shadow-md">
                <div class="flex items-center gap-2 flex-wrap">
                    <button id="btnRun" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold py-2 px-4 rounded-xl shadow-lg transition flex items-center gap-2 text-xs md:text-sm">
                        <i class="fa-solid fa-play"></i> Jalankan Kode
                    </button>
                    <button id="btnReset" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-semibold py-2 px-3 rounded-xl transition border border-slate-700 text-xs md:text-sm">
                        <i class="fa-solid fa-rotate-right"></i> Reset
                    </button>
                    <button id="btnShuffle" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 font-semibold py-2 px-3 rounded-xl transition border border-amber-500/40 text-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-shuffle"></i> Acak Posisi Landmark
                    </button>
                </div>

                <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                    <span class="text-slate-400 font-medium px-1 text-[11px]"><i class="fa-solid fa-bolt text-amber-400"></i> Speed:</span>
                    <button id="speedSlow" class="px-2 py-0.5 rounded-lg bg-slate-800 text-slate-300 font-semibold text-[10px] hover:bg-slate-700">Pelan</button>
                    <button id="speedFast" class="px-2 py-0.5 rounded-lg bg-emerald-500 text-slate-950 font-bold text-[10px]">Cepat</button>
                </div>
            </div>

            <!-- Mission Banner -->
            <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex items-center justify-between gap-3 shadow-md">
                <div class="flex items-center gap-3 flex-1">
                    <div class="bg-amber-500/20 text-amber-400 p-2.5 rounded-xl text-xl flex-shrink-0 border border-amber-500/30">
                        <i class="fa-solid fa-compass-drafting"></i>
                    </div>
                    <div>
                        <h2 id="missionTitle" class="text-sm md:text-base font-bold text-emerald-400 font-heading">Misi Loading...</h2>
                        <p id="missionDesc" class="text-xs text-slate-300 mt-0.5 leading-relaxed">Menyiapkan instruksi jalan...</p>
                    </div>
                </div>

                <!-- Compass Rose -->
                <div class="bg-slate-950/80 border border-slate-800 p-1.5 rounded-xl text-[9px] font-bold text-slate-400 w-11 text-center shadow-inner flex flex-col justify-between flex-shrink-0">
                    <span class="text-rose-500 font-black">U</span>
                    <div class="flex justify-between my-0.5 text-[8px]">
                        <span>B</span>
                        <span>T</span>
                    </div>
                    <span class="text-emerald-500">S</span>
                </div>
            </div>

            <!-- Blockly Workspace Canvas -->
            <div class="flex-1 bg-slate-900 rounded-2xl border border-slate-800 p-2.5 flex flex-col relative min-h-[380px]">
                <div class="text-xs font-bold text-slate-400 mb-2 px-1 flex justify-between items-center">
                    <span class="flex items-center gap-1.5 text-emerald-400"><i class="fa-solid fa-puzzle-piece text-amber-400"></i> Workspace Perintah Kode</span>
                    <span class="text-[10px] text-slate-500 font-normal">Tarik blok ke kanan untuk menyusun logika</span>
                </div>
                <div id="blocklyDiv" class="w-full flex-1 rounded-xl overflow-hidden min-h-[350px]"></div>
            </div>
        </section>

        <!-- RIGHT PANEL: Canvas Map Denah Kota -->
        <section class="lg:w-1/2 flex flex-col items-center gap-3 order-1 lg:order-2">
            
            <div class="bg-slate-900 p-2 md:p-3 rounded-2xl border border-slate-800 shadow-2xl relative w-full flex flex-col items-center">
                <div class="relative w-full aspect-square max-w-[560px] overflow-hidden rounded-xl bg-slate-950 border border-slate-800 shadow-2xl">
                    <canvas id="cityCanvas" class="w-full h-full block"></canvas>
                    
                    <!-- Notification Banner -->
                    <div id="statusBanner" class="absolute top-4 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-2xl border border-slate-700 transition-all transform scale-0 duration-300 flex items-center gap-2 z-20 pointer-events-none whitespace-nowrap">
                        <i id="statusIcon" class="fa-solid fa-info-circle text-emerald-400"></i>
                        <span id="statusMessage">Game Siap!</span>
                    </div>
                </div>

                <!-- Map Legend -->
                <div class="w-full flex flex-wrap justify-between items-center text-[11px] text-slate-400 mt-2 px-2 gap-2">
                    <span class="flex items-center gap-1.5"><span class="w-3 h-2 rounded-xs bg-slate-700 border border-amber-400 inline-block"></span> Jalan Aspal Single Vertikal</span>
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-400 inline-block border border-white"></span> Bus Si Yo</span>
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-rose-500 inline-block border border-white"></span> Target Misi</span>
                </div>
            </div>

        </section>

    </main>

    <!-- Blockly Toolbox XML -->
    <xml id="toolbox" style="display: none">
        <category name="Pergerakan Jalur" colour="#3b82f6">
            <block type="move_forward"></block>
            <block type="turn_left"></block>
            <block type="turn_right"></block>
            <block type="move_direction"></block>
        </category>
        <category name="Pengulangan / Loop" colour="#10b981">
            <block type="repeat_times">
                <value name="TIMES">
                    <shadow type="math_number">
                        <field name="NUM">3</field>
                    </shadow>
                </value>
            </block>
        </category>
    </xml>

    <script>
        // Web Audio SFX using Tone.js
        const SFX = {
            step: () => {
                try {
                    const synth = new Tone.MembraneSynth({ volume: -14 }).toDestination();
                    synth.triggerAttackRelease("C2", "16n");
                } catch(e){}
            },
            turn: () => {
                try {
                    const synth = new Tone.Synth({ volume: -16 }).toDestination();
                    synth.triggerAttackRelease("G4", "32n");
                } catch(e){}
            },
            success: () => {
                try {
                    const synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    const now = Tone.now();
                    synth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "8n", now);
                } catch(e){}
            },
            fail: () => {
                try {
                    const synth = new Tone.Synth({ volume: -10 }).toDestination();
                    synth.triggerAttackRelease("G2", "8n");
                } catch(e){}
            }
        };

        const GRID_SIZE = 12;

        const DIR_VECTORS = [
            { x: 0, y: -1 }, // North (0)
            { x: 1, y: 0 },  // East (1)
            { x: 0, y: 1 },  // South (2)
            { x: -1, y: 0 }  // West (3)
        ];

        // Available Building Slots on Grid (16 slots in total)
        const BUILDING_SLOTS = [
            { x: 1, y: 10 }, { x: 1, y: 8 }, { x: 3, y: 10 }, { x: 3, y: 8 }, // SW
            { x: 8, y: 10 }, { x: 10, y: 10 }, { x: 8, y: 8 }, { x: 10, y: 8 }, // SE
            { x: 1, y: 1 }, { x: 3, y: 1 }, { x: 1, y: 3 }, { x: 3, y: 3 },   // NW
            { x: 8, y: 1 }, { x: 10, y: 1 }, { x: 10, y: 3 }, { x: 8, y: 3 }   // NE
        ];

        // 16 Detailed Landmarks mapped on grid
        let LANDMARKS = [
            { id: 'rumah_siyo', name: 'Rumah Si Yo', type: 'house', color: '#10b981', x: 1, y: 10 },
            { id: 'stasiun_bus_kereta', name: 'Stasiun Kereta & Bus', type: 'station', color: '#0284c7', x: 1, y: 8 },
            { id: 'sekolah', name: 'Sekolah Si Yo', type: 'school', color: '#f59e0b', x: 3, y: 10 },
            { id: 'rumah_sakit', name: 'Rumah Sakit', type: 'hospital', color: '#ef4444', x: 8, y: 10 },
            { id: 'apotek', name: 'Apotek', type: 'pharmacy', color: '#06b6d4', x: 10, y: 10 },
            { id: 'kantor_polisi', name: 'Kantor Polisi', type: 'police', color: '#1e40af', x: 8, y: 8 },
            { id: 'pemadam', name: 'Stasiun Damkar', type: 'firestation', color: '#dc2626', x: 10, y: 8 },
            { id: 'pasar', name: 'Pasar Kota', type: 'market', color: '#d97706', x: 1, y: 1 },
            { id: 'toko_buku', name: 'Toko Buku', type: 'bookstore', color: '#ec4899', x: 3, y: 1 },
            { id: 'toko_kelontong', name: 'Toko Kelontong', type: 'grocery', color: '#84cc16', x: 1, y: 3 },
            { id: 'kolam_renang', name: 'Kolam Renang', type: 'pool', color: '#0284c7', x: 8, y: 1 },
            { id: 'stadion', name: 'Stadion Utama', type: 'stadium', color: '#16a34a', x: 10, y: 1 },
            { id: 'gedung_teater', name: 'Gedung Teater', type: 'theater', color: '#9333ea', x: 10, y: 3 },
            { id: 'hutan_kota', name: 'Hutan & Camping', type: 'park', color: '#15803d', x: 8, y: 3 },
            { id: 'museum', name: 'Museum Sejarah', type: 'museum', color: '#b45309', x: 3, y: 3 },
            { id: 'kantor_walikota', name: 'Kantor Walikota', type: 'cityhall', color: '#475569', x: 6, y: 4 }
        ];

        // Misi Permainan
        const MISSIONS = [
            {
                id: 1,
                title: "Misi 1: Berangkat ke Sekolah",
                desc: "Si Yo ingin berangkat ke Sekolah dari Rumahnya! Susun jalur melangkah ke Sekolah.",
                startLandmarkId: 'rumah_siyo',
                targetLandmarkId: 'sekolah'
            },
            {
                id: 2,
                title: "Misi 2: Beli Obat di Apotek",
                desc: "Jalan dari Rumah Sakit menuju Apotek untuk membeli obat.",
                startLandmarkId: 'rumah_sakit',
                targetLandmarkId: 'apotek'
            },
            {
                id: 3,
                title: "Misi 3: Wisata Edukasi ke Museum",
                desc: "Berangkat dari Sekolah, lewati bundaran alun-alun menuju Museum Sejarah!",
                startLandmarkId: 'sekolah',
                targetLandmarkId: 'museum'
            },
            {
                id: 4,
                title: "Misi 4: Olahraga ke Kolam Renang",
                desc: "Dari Pasar Tradisional, lintasi jalan utama ke Kolam Renang!",
                startLandmarkId: 'pasar',
                targetLandmarkId: 'kolam_renang'
            },
            {
                id: 5,
                title: "Misi 5: Berkemah di Hutan Kota",
                desc: "Bantu Si Yo pergi dari Kantor Polisi menuju Hutan Kota & Camping Ground!",
                startLandmarkId: 'kantor_polisi',
                targetLandmarkId: 'hutan_kota'
            },
            {
                id: 6,
                title: "Misi 6: Pertemuan di Kantor Walikota",
                desc: "Berangkat dari Stasiun Kereta, kendarai bus menuju Gedung Walikota!",
                startLandmarkId: 'stasiun_bus_kereta',
                targetLandmarkId: 'kantor_walikota'
            }
        ];

        // SINGLE VERTICAL ROAD at x = 6. Central Horizontal at y = 5. Ring Road around outer blocks.
        function isRoadCell(x, y) {
            if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return false;

            // Single Central Vertical Avenue
            const isSingleVerticalMain = (x === 6);
            
            // Peripheral Vertical Roads
            const isSideVertical = (x === 2 || x === 9);

            // Horizontal Avenues
            const isHorizontalMain = (y === 1 || y === 5 || y === 9);

            // Central Alun-Alun Roundabout Ring
            const isRoundaboutRing = (x >= 5 && x <= 7 && y >= 4 && y <= 6);

            return isSingleVerticalMain || isSideVertical || isHorizontalMain || isRoundaboutRing;
        }

        // Get nearest road tile for starting/ending adjacent to a landmark
        function getNearestRoadTile(landmarkX, landmarkY) {
            const candidates = [
                { x: landmarkX + 1, y: landmarkY },
                { x: landmarkX - 1, y: landmarkY },
                { x: landmarkX, y: landmarkY + 1 },
                { x: landmarkX, y: landmarkY - 1 }
            ];
            for (let c of candidates) {
                if (isRoadCell(c.x, c.y)) return c;
            }
            return { x: landmarkX, y: landmarkY };
        }

        // Blockly Custom Block Definitions
        Blockly.Blocks['move_forward'] = {
            init: function() {
                this.appendDummyInput().appendField("Maju 1 Petak");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour("#3b82f6");
                this.setTooltip("Mobil bergerak maju 1 petak sesuai arah hadap.");
            }
        };

        Blockly.Blocks['turn_left'] = {
            init: function() {
                this.appendDummyInput().appendField("Belok Kiri ↺");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour("#2563eb");
                this.setTooltip("Memutar kendaraan 90 derajat ke kiri.");
            }
        };

        Blockly.Blocks['turn_right'] = {
            init: function() {
                this.appendDummyInput().appendField("Belok Kanan ↻");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour("#2563eb");
                this.setTooltip("Memutar kendaraan 90 derajat ke kanan.");
            }
        };

        Blockly.Blocks['move_direction'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("Maju ke Arah")
                    .appendField(new Blockly.FieldDropdown([
                        ["Utara (▲)", "0"],
                        ["Timur (►)", "1"],
                        ["Selatan (▼)", "2"],
                        ["Barat (◄)", "3"]
                    ]), "DIR");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour("#0284c7");
                this.setTooltip("Langsung melangkah ke arah kompas terpilih.");
            }
        };

        Blockly.Blocks['repeat_times'] = {
            init: function() {
                this.appendValueInput("TIMES")
                    .setCheck("Number")
                    .appendField("Ulangi");
                this.appendDummyInput().appendField("kali");
                this.appendStatementInput("DO")
                    .appendField("kerjakan");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour("#10b981");
                this.setTooltip("Mengulang perintah di dalam blok.");
            }
        };

        const CustomJS = new Blockly.Generator('JS');
        CustomJS.PRECEDENCE = 0;

        CustomJS.scrub_ = function(block, code, thisOnly) {
            const nextBlock = block.nextConnection && block.nextConnection.targetBlock();
            if (nextBlock && !thisOnly) {
                return code + CustomJS.blockToCode(nextBlock);
            }
            return code;
        };

        CustomJS['move_forward'] = function(block) {
            return 'actions.push({type: "MOVE_FORWARD"});\n';
        };

        CustomJS['turn_left'] = function(block) {
            return 'actions.push({type: "TURN_LEFT"});\n';
        };

        CustomJS['turn_right'] = function(block) {
            return 'actions.push({type: "TURN_RIGHT"});\n';
        };

        CustomJS['move_direction'] = function(block) {
            const dir = block.getFieldValue('DIR');
            return `actions.push({type: "MOVE_DIR", dir: ${dir}});\n`;
        };

        CustomJS['repeat_times'] = function(block) {
            const repeats = CustomJS.valueToCode(block, 'TIMES', CustomJS.PRECEDENCE) || '1';
            const branch = CustomJS.statementToCode(block, 'DO');
            return `for (let i = 0; i < ${repeats}; i++) {\n${branch}}\n`;
        };

        CustomJS['math_number'] = function(block) {
            const code = String(block.getFieldValue('NUM'));
            return [code, CustomJS.PRECEDENCE];
        };

        let workspace = null;
        let currentMissionIndex = 0;
        let player = { x: 2, y: 9, dir: 0 };
        let currentTargetPos = { x: 3, y: 9 };
        let isExecuting = false;
        let executionSpeed = 300;

        const canvas = document.getElementById('cityCanvas');
        const ctx = canvas.getContext('2d');

        window.addEventListener('DOMContentLoaded', () => {
            initBlockly();
            initLevelDropdown();
            setupEventListeners();
            
            resizeCanvas();
            loadMission(0);

            window.addEventListener('resize', () => {
                resizeCanvas();
                renderMap();
            });
        });

        function resizeCanvas() {
            const parent = canvas.parentElement;
            const displayWidth = parent.clientWidth || 540;
            const dpr = window.devicePixelRatio || 1;

            canvas.width = displayWidth * dpr;
            canvas.height = displayWidth * dpr;

            ctx.resetTransform();
            ctx.scale(dpr, dpr);
        }

        function initBlockly() {
            workspace = Blockly.inject('blocklyDiv', {
                toolbox: document.getElementById('toolbox'),
                scrollbars: true,
                trashcan: true,
                zoom: {
                    controls: true,
                    wheel: true,
                    startScale: 0.9,
                    maxScale: 1.4,
                    minScale: 0.6
                },
                grid: {
                    spacing: 20,
                    length: 3,
                    colour: '#334155',
                    snap: true
                }
            });
        }

        function initLevelDropdown() {
            const levelSelect = document.getElementById('levelSelect');
            levelSelect.innerHTML = '';
            MISSIONS.forEach((m, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `Misi ${m.id}: ${m.title.split(':')[1].trim()}`;
                levelSelect.appendChild(opt);
            });

            levelSelect.addEventListener('change', (e) => {
                loadMission(parseInt(e.target.value));
            });
        }

        function setupEventListeners() {
            document.getElementById('btnRun').addEventListener('click', runCode);
            document.getElementById('btnReset').addEventListener('click', () => {
                loadMission(currentMissionIndex);
                showStatus("Posisi Si Yo direset.", "fa-rotate-right", "bg-slate-800");
            });

            document.getElementById('btnShuffle').addEventListener('click', shuffleLandmarkPositions);

            const speedSlow = document.getElementById('speedSlow');
            const speedFast = document.getElementById('speedFast');

            speedSlow.addEventListener('click', () => {
                executionSpeed = 500;
                speedSlow.className = "px-2 py-0.5 rounded-lg bg-emerald-500 text-slate-950 font-bold text-[10px]";
                speedFast.className = "px-2 py-0.5 rounded-lg bg-slate-800 text-slate-300 font-semibold text-[10px] hover:bg-slate-700";
            });

            speedFast.addEventListener('click', () => {
                executionSpeed = 220;
                speedFast.className = "px-2 py-0.5 rounded-lg bg-emerald-500 text-slate-950 font-bold text-[10px]";
                speedSlow.className = "px-2 py-0.5 rounded-lg bg-slate-800 text-slate-300 font-semibold text-[10px] hover:bg-slate-700";
            });
        }

        // Shuffle building positions across slots
        function shuffleLandmarkPositions() {
            if (isExecuting) return;

            // Fisher-Yates shuffle slots
            const shuffledSlots = [...BUILDING_SLOTS];
            for (let i = shuffledSlots.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledSlots[i], shuffledSlots[j]] = [shuffledSlots[j], shuffledSlots[i]];
            }

            // Assign new coordinates to landmarks
            LANDMARKS.forEach((lm, index) => {
                lm.x = shuffledSlots[index].x;
                lm.y = shuffledSlots[index].y;
            });

            showStatus("Posisi 16 landmark berhasil diacak!", "fa-shuffle", "bg-amber-600");
            loadMission(currentMissionIndex);
        }

        function loadMission(index) {
            currentMissionIndex = index;
            const mission = MISSIONS[index];
            isExecuting = false;

            // Find start & target landmark objects
            const startLm = LANDMARKS.find(l => l.id === mission.startLandmarkId);
            const targetLm = LANDMARKS.find(l => l.id === mission.targetLandmarkId);

            // Compute road tile positions
            const startRoad = getNearestRoadTile(startLm.x, startLm.y);
            const targetRoad = getNearestRoadTile(targetLm.x, targetLm.y);

            player = { x: startRoad.x, y: startRoad.y, dir: 0 };
            currentTargetPos = { x: targetRoad.x, y: targetRoad.y };

            document.getElementById('missionTitle').textContent = mission.title;
            document.getElementById('missionDesc').textContent = mission.desc;
            document.getElementById('levelSelect').value = index;

            workspace.clear();
            const startBlock = workspace.newBlock('move_forward');
            startBlock.initSvg();
            startBlock.render();

            renderMap();
        }

        function renderMap() {
            const displaySize = canvas.clientWidth || 540;
            const cellSize = displaySize / GRID_SIZE;

            ctx.clearRect(0, 0, displaySize, displaySize);

            // 1. Grass Ground Surface
            ctx.fillStyle = '#1e3a29';
            ctx.fillRect(0, 0, displaySize, displaySize);

            // 2. Draw District Grass Grounds
            drawDistricts(displaySize, cellSize);

            // 3. Draw Sidewalks & Roads (Single Vertical Middle Road)
            drawRoadNetwork(displaySize, cellSize);

            // 4. Draw Center Alun-Alun Roundabout
            drawRoundabout(cellSize);

            // 5. Render 16 Detailed Top-Down Vector Landmarks
            LANDMARKS.forEach(lm => drawLandmarkDetail(lm, cellSize));

            // 6. Draw Target Destination Marker
            drawTargetMarker(cellSize);

            // 7. Draw Player Character (Si Yo Bus Tour)
            drawPlayerVehicle(cellSize);
        }

        function drawDistricts(displaySize, cellSize) {
            // Background grass patches & tree clusters
            ctx.fillStyle = '#224e34';
            ctx.fillRect(2, 2, displaySize - 4, displaySize - 4);

            // Render realistic top-down trees in grass spaces
            drawTreesCluster(cellSize * 0.5, cellSize * 0.5, cellSize * 0.18, 3);
            drawTreesCluster(cellSize * 11.2, cellSize * 0.5, cellSize * 0.18, 4);
            drawTreesCluster(cellSize * 0.5, cellSize * 11.2, cellSize * 0.18, 3);
            drawTreesCluster(cellSize * 11.2, cellSize * 11.2, cellSize * 0.18, 4);
        }

        function drawRoadNetwork(displaySize, cellSize) {
            // Sidewalk Layer
            ctx.fillStyle = '#cbd5e1';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (isRoadCell(c, r)) {
                        ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                    }
                }
            }

            // Dark Asphalt Layer
            ctx.fillStyle = '#272e3f';
            const sPad = cellSize * 0.08;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (isRoadCell(c, r)) {
                        ctx.fillRect(c * cellSize + sPad, r * cellSize + sPad, cellSize - sPad * 2, cellSize - sPad * 2);
                    }
                }
            }

            // Yellow Dashed Lane Markings
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (isRoadCell(c, r)) {
                        const cx = c * cellSize + cellSize / 2;
                        const cy = r * cellSize + cellSize / 2;

                        ctx.strokeStyle = '#f59e0b';
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([4, 4]);

                        if (isRoadCell(c, r - 1) && isRoadCell(c, r + 1)) {
                            ctx.beginPath();
                            ctx.moveTo(cx, r * cellSize);
                            ctx.lineTo(cx, (r + 1) * cellSize);
                            ctx.stroke();
                        }
                        if (isRoadCell(c - 1, r) && isRoadCell(c + 1, r)) {
                            ctx.beginPath();
                            ctx.moveTo(c * cellSize, cy);
                            ctx.lineTo((c + 1) * cellSize, cy);
                            ctx.stroke();
                        }
                        ctx.setLineDash([]);

                        if (isIntersection(c, r)) {
                            drawZebraCross(c, r, cellSize);
                        }
                    }
                }
            }
        }

        function isIntersection(c, r) {
            let conn = 0;
            if (isRoadCell(c+1, r)) conn++;
            if (isRoadCell(c-1, r)) conn++;
            if (isRoadCell(c, r+1)) conn++;
            if (isRoadCell(c, r-1)) conn++;
            return conn >= 3;
        }

        function drawZebraCross(c, r, cellSize) {
            ctx.fillStyle = '#ffffff';
            const numStripes = 4;
            const stripeW = cellSize / (numStripes * 2);
            for (let i = 0; i < numStripes; i++) {
                ctx.fillRect(c * cellSize + (i * 2 + 0.5) * stripeW, r * cellSize + 2, stripeW, cellSize * 0.16);
                ctx.fillRect(c * cellSize + (i * 2 + 0.5) * stripeW, (r + 1) * cellSize - cellSize * 0.18, stripeW, cellSize * 0.16);
            }
        }

        function drawRoundabout(cellSize) {
            const rx = 6.5 * cellSize;
            const ry = 5.5 * cellSize;
            const radius = cellSize * 0.9;

            // Park Plaza Circle
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.arc(rx, ry, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Fountain
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.arc(rx, ry, radius * 0.45, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(rx - 1.5, ry - 1.5, 3, 3);
        }

        function drawLandmarkDetail(lm, cellSize) {
            const lx = lm.x * cellSize;
            const ly = lm.y * cellSize;
            const size = cellSize;

            // Building Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(lx + 3, ly + 3, size - 2, size - 2);

            // Vector Architectural Graphics
            switch (lm.type) {
                case 'house':
                    ctx.fillStyle = '#059669';
                    ctx.fillRect(lx + 2, ly + 2, size - 4, size - 4);
                    ctx.fillStyle = '#dc2626';
                    ctx.beginPath();
                    ctx.moveTo(lx + size / 2, ly + 4);
                    ctx.lineTo(lx + size - 5, ly + size / 2);
                    ctx.lineTo(lx + 5, ly + size / 2);
                    ctx.fill();
                    break;

                case 'school':
                    ctx.fillStyle = '#d97706';
                    ctx.fillRect(lx + 2, ly + 2, size - 4, size - 4);
                    ctx.fillStyle = '#b45309';
                    ctx.fillRect(lx + 5, ly + 5, size - 10, size - 10);
                    // Flagpole
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(lx + size / 2 - 1, ly + size / 2 - 2, 2, 8);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(lx + size / 2 + 1, ly + size / 2 - 2, 4, 3);
                    break;

                case 'stadium':
                    ctx.fillStyle = '#334155';
                    ctx.fillRect(lx + 2, ly + 2, size - 4, size - 4);
                    ctx.fillStyle = '#16a34a';
                    ctx.fillRect(lx + 5, ly + 6, size - 10, size - 12);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(lx + 7, ly + 8, size - 14, size - 16);
                    break;

                case 'pool':
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillRect(lx + 2, ly + 2, size - 4, size - 4);
                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(lx + 5, ly + 5, size - 10, size - 10);
                    break;

                case 'hospital':
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(lx + 2, ly + 2, size - 4, size - 4);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(lx + size / 2 - 2.5, ly + 6, 5, size - 12);
                    ctx.fillRect(lx + 6, ly + size / 2 - 2.5, size - 12, 5);
                    break;

                case 'station':
                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(lx + 2, ly + 2, size - 4, size - 4);
                    ctx.strokeStyle = '#64748b';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(lx + 4, ly + size - 6);
                    ctx.lineTo(lx + size - 4, ly + size - 6);
                    ctx.stroke();
                    break;

                case 'park':
                    ctx.fillStyle = '#14532d';
                    ctx.fillRect(lx + 2, ly + 2, size - 4, size - 4);
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.moveTo(lx + 8, ly + 8);
                    ctx.lineTo(lx + 14, ly + 16);
                    ctx.lineTo(lx + 2, ly + 16);
                    ctx.fill();
                    break;

                default:
                    ctx.fillStyle = lm.color;
                    ctx.fillRect(lx + 2, ly + 2, size - 4, size - 4);
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.fillRect(lx + 4, ly + 4, size - 8, size - 8);
                    break;
            }

            // Visible Text Name Label on Top of Landmark
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fillRect(lx + 1, ly + size - 12, size - 2, 11);

            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 7.5px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(lm.name, lx + size / 2, ly + size - 4);
        }

        function drawTreesCluster(x, y, radius, count) {
            ctx.fillStyle = '#15803d';
            for (let i = 0; i < count; i++) {
                const tx = x + (i % 2) * radius * 1.4;
                const ty = y + Math.floor(i / 2) * radius * 1.4;
                ctx.beginPath();
                ctx.arc(tx, ty, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawTargetMarker(cellSize) {
            const tx = currentTargetPos.x * cellSize + cellSize / 2;
            const ty = currentTargetPos.y * cellSize + cellSize / 2;

            ctx.fillStyle = 'rgba(244, 63, 94, 0.35)';
            ctx.beginPath();
            ctx.arc(tx, ty, cellSize * 0.65, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(tx, ty, cellSize * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🏁', tx, ty + 3);
        }

        function drawPlayerVehicle(cellSize) {
            const px = player.x * cellSize + cellSize / 2;
            const py = player.y * cellSize + cellSize / 2;

            ctx.save();
            ctx.translate(px, py);

            const angles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
            ctx.rotate(angles[player.dir]);

            const busW = cellSize * 0.42;
            const busH = cellSize * 0.72;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(-busW / 2 + 2, -busH / 2 + 3, busW, busH);

            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(-busW / 2, -busH / 2, busW, busH, 5);
            } else {
                ctx.rect(-busW / 2, -busH / 2, busW, busH);
            }
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.fillStyle = '#0284c7';
            ctx.fillRect(-busW / 2 + 2, -busH / 2 + 3, busW - 4, 5);

            ctx.restore();
        }

        function runCode() {
            if (isExecuting) return;

            const actions = [];
            try {
                const code = CustomJS.workspaceToCode(workspace);
                eval(code);
            } catch (e) {
                console.error(e);
                showStatus("Gagal membaca blok kode!", "fa-triangle-exclamation", "bg-rose-600");
                return;
            }

            if (actions.length === 0) {
                showStatus("Tarik blok perintah terlebih dahulu!", "fa-lightbulb", "bg-amber-600");
                return;
            }

            isExecuting = true;
            document.getElementById('btnRun').disabled = true;
            showStatus("Si Yo sedang meluncur...", "fa-bus-simple", "bg-emerald-600");

            const mission = MISSIONS[currentMissionIndex];
            const startLm = LANDMARKS.find(l => l.id === mission.startLandmarkId);
            const startRoad = getNearestRoadTile(startLm.x, startLm.y);

            player = { x: startRoad.x, y: startRoad.y, dir: 0 };
            renderMap();

            let stepIndex = 0;

            function processNextStep() {
                if (stepIndex >= actions.length) {
                    checkMissionCompletion();
                    isExecuting = false;
                    document.getElementById('btnRun').disabled = false;
                    return;
                }

                const action = actions[stepIndex];
                stepIndex++;

                if (action.type === "MOVE_FORWARD") {
                    const vec = DIR_VECTORS[player.dir];
                    const nextX = player.x + vec.x;
                    const nextY = player.y + vec.y;

                    if (isRoadCell(nextX, nextY)) {
                        player.x = nextX;
                        player.y = nextY;
                        SFX.step();
                    } else {
                        SFX.fail();
                        showStatus("Menabrak trotoar/bangunan!", "fa-car-burst", "bg-rose-600");
                        isExecuting = false;
                        document.getElementById('btnRun').disabled = false;
                        renderMap();
                        return;
                    }
                } else if (action.type === "TURN_LEFT") {
                    player.dir = (player.dir + 3) % 4;
                    SFX.turn();
                } else if (action.type === "TURN_RIGHT") {
                    player.dir = (player.dir + 1) % 4;
                    SFX.turn();
                } else if (action.type === "MOVE_DIR") {
                    player.dir = action.dir;
                    const vec = DIR_VECTORS[player.dir];
                    const nextX = player.x + vec.x;
                    const nextY = player.y + vec.y;

                    if (isRoadCell(nextX, nextY)) {
                        player.x = nextX;
                        player.y = nextY;
                        SFX.step();
                    } else {
                        SFX.fail();
                        showStatus("Jalur tersebut terhalang!", "fa-ban", "bg-rose-600");
                        isExecuting = false;
                        document.getElementById('btnRun').disabled = false;
                        renderMap();
                        return;
                    }
                }

                renderMap();
                setTimeout(processNextStep, executionSpeed);
            }

            setTimeout(processNextStep, 150);
        }

        function checkMissionCompletion() {
            const reached = (player.x === currentTargetPos.x && player.y === currentTargetPos.y);

            if (reached) {
                SFX.success();
                showStatus("HEBAT! Kamu berhasil sampai di tujuan! 🎉", "fa-circle-check", "bg-emerald-600");
                
                setTimeout(() => {
                    if (currentMissionIndex < MISSIONS.length - 1) {
                        if (confirm(`Luar biasa! Misi ${currentMissionIndex + 1} Selesai.\n\nLanjut ke Misi ${currentMissionIndex + 2}?`)) {
                            loadMission(currentMissionIndex + 1);
                        }
                    } else {
                        alert("SELAMAT! Kamu telah menyelesaikan SELURUH MISI City Tour!");
                    }
                }, 350);

            } else {
                SFX.fail();
                showStatus("Belum sampai di tujuan. Coba periksa kodenya!", "fa-circle-exclamation", "bg-amber-600");
            }
        }

        function showStatus(msg, iconClass = "fa-info-circle", bgClass = "bg-slate-900") {
            const banner = document.getElementById('statusBanner');
            const icon = document.getElementById('statusIcon');
            const message = document.getElementById('statusMessage');

            message.textContent = msg;
            icon.className = `fa-solid ${iconClass} text-emerald-400`;
            banner.className = `absolute top-4 left-1/2 -translate-x-1/2 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-2xl border border-slate-700 transition-all transform scale-100 duration-300 flex items-center gap-2 z-20 ${bgClass}`;

            setTimeout(() => {
                banner.classList.remove('scale-100');
                banner.classList.add('scale-0');
            }, 3000);
        }
    </script>
